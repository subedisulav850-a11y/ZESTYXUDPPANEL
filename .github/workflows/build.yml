name: Build Zesty Proxy APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Write keystore (optional)
        if: "${{ secrets.KEYSTORE_BASE64 != '' }}"
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > zesty-release.jks
          printf 'storeFile=zesty-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASS" "$KEY_ALIAS" "$KEY_PASS" > keystore.properties

      - name: Build release APK
        run: |
          if [ -f keystore.properties ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleRelease --no-daemon -PinsecureReleaseOk=true --stacktrace
          fi

      - name: Rename APKs
        run: |
          BUILD="${{ github.run_number }}"
          VERSION=$(grep 'versionName' app/build.gradle | head -1 | sed 's/.*"\(.*\)".*/\1/')
          [ -z "$VERSION" ] && VERSION="2.0"

          DEBUG_IN="app/build/outputs/apk/debug/app-debug.apk"
          REL_IN="app/build/outputs/apk/release/app-release.apk"
          REL_UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"

          [ -f "$DEBUG_IN" ] && mv "$DEBUG_IN" "app/build/outputs/apk/debug/ZestyProxy-v${VERSION}-b${BUILD}-debug.apk"
          [ -f "$REL_IN" ] && mv "$REL_IN" "app/build/outputs/apk/release/ZestyProxy-v${VERSION}-b${BUILD}-release.apk"
          [ -f "$REL_UNSIGNED" ] && mv "$REL_UNSIGNED" "app/build/outputs/apk/release/ZestyProxy-v${VERSION}-b${BUILD}-release-unsigned.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ZestyProxy-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ZestyProxy-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Build summary
        run: |
          {
            echo "## Zesty Proxy — Build ${{ github.run_number }}"
            echo "**Branch:** \`${{ github.ref_name }}\`"
            echo "**Commit:** \`${{ github.sha }}\`"
            echo ""
            echo "| APK | Size |"
            echo "|-----|------|"
            for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
              [ -f "$apk" ] && echo "| \`$(basename "$apk")\` | $(du -sh "$apk" | cut -f1) |"
            done
            echo ""
            echo "> Built by [Zesty](https://t.me/zestyji)"
          } >> "$GITHUB_STEP_SUMMARY"
